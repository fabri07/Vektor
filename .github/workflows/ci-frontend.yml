name: CI — Frontend

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      # El corpus de escaneo lo leen los tests de los DOS lados: si sólo lo
      # viera su propio CI, un cambio ahí podría separar las dos
      # implementaciones sin que nadie se entere.
      - "shared/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      # El corpus de escaneo lo leen los tests de los DOS lados: si sólo lo
      # viera su propio CI, un cambio ahí podría separar las dos
      # implementaciones sin que nadie se entere.
      - "shared/**"
      - ".github/workflows/ci-frontend.yml"

# Un solo run vivo por rama: si llega otro push al mismo PR, el run anterior
# se cancela en lugar de correr completo al lado del nuevo (en el PR #97 se
# pagaron 3 runs de ~30 min para verificar un único estado del código, y el
# cupo gratuito de Actions se agotó el 2026-10-09).
#
# Acotado a pull_request a propósito: en push a main cada commit tiene que
# quedar verificado por sí mismo (main despliega solo), así que ahí NO se
# cancela nada.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Type-check · Lint · Test · Build
    # `vars.CI_RUNNER` (variable del repo) elige dónde corre: vacía → runner
    # de GitHub; `self-hosted` → el runner propio (no consume minutos del
    # cupo). Ver "Runner propio" en docs/claude/ci.md.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: frontend

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Node 20 ───────────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── 3. npm ci (cached) ───────────────────────────────────────────────────
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      # ── 4. Jest (suite completa, compuerta obligatoria) ───────────────────────
      # Va ANTES de tsc/lint/build para fallar rápido: los tests son lo más
      # barato de correr y lo que más se rompe.
      #
      # Este paso no existía hasta 2026-08-26, y su ausencia costó 8 días de 9
      # suites en rojo sin que nadie se enterara: el copy pass de #49 cambió
      # rótulos en 19 archivos y rompió 46 tests que el CI nunca ejecutó.
      #
      # `--runInBand`: con workers, jest da fallas FALSAS en este repo, y los
      # runners de GitHub tienen 2 vCPU. `--ci`: un snapshot nuevo falla en vez
      # de escribirse solo. SIN `--passWithNoTests` a propósito — el default de
      # jest ya falla si no encuentra tests, y queremos que una suite que
      # desaparece por accidente también se vea.
      - name: Jest — unit tests
        run: npm test -- --ci --runInBand

      # ── 5. TypeScript type check ──────────────────────────────────────────────
      - name: tsc — type check
        run: npm run type-check

      # ── 6. ESLint ─────────────────────────────────────────────────────────────
      - name: ESLint — lint
        run: npm run lint

      # ── 7. Next.js production build ───────────────────────────────────────────
      - name: Next.js — build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        run: npm run build
