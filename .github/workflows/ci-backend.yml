name: CI — Backend

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      # El corpus de escaneo lo leen los tests de los DOS lados: si sólo lo
      # viera su propio CI, un cambio ahí podría separar las dos
      # implementaciones sin que nadie se entere.
      - "shared/**"
      # El tope de tamaño de CLAUDE.md lo mide un test del backend.
      - "CLAUDE.md"
      - "docs/claude/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      # El corpus de escaneo lo leen los tests de los DOS lados: si sólo lo
      # viera su propio CI, un cambio ahí podría separar las dos
      # implementaciones sin que nadie se entere.
      - "shared/**"
      # El tope de tamaño de CLAUDE.md lo mide un test del backend.
      - "CLAUDE.md"
      - "docs/claude/**"
      - ".github/workflows/ci-backend.yml"

# Un solo run vivo por rama: si llega otro push al mismo PR, el run anterior
# se cancela en lugar de correr completo al lado del nuevo (en el PR #97 se
# pagaron 3 runs de ~30 min para verificar un único estado del código, y el
# cupo gratuito de Actions se agotó el 2026-10-09).
#
# Acotado a pull_request a propósito: en push a main cada commit tiene que
# quedar verificado por sí mismo (main despliega solo), así que ahí NO se
# cancela nada.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint · Type-check · Test · Docker build
    # `vars.CI_RUNNER` (variable del repo) elige dónde corre: vacía → runner
    # de GitHub; `self-hosted` → el runner propio (no consume minutos del
    # cupo). Ver "Runner propio" en docs/claude/ci.md.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: backend

    # Postgres real para los tests de concurrencia (advisory locks F3 + lease F4):
    # los primitivos que hacen la exclusión mutua sólo existen en Postgres, en
    # SQLite son no-op. Sin esto la garantía de concurrencia no queda cubierta
    # contra regresiones (ver test_maintenance_lock_pg.py / test_ingestion_lease_pg.py).
    #
    # Puerto 55432 y no 5432: en el runner propio el 5432 es el compose local
    # del dev, y los tests PG hacen downgrade/upgrade de migraciones reales.
    # Los services sólo existen en runners Linux: en el runner propio la imagen
    # vacía apaga el service (GitHub no lo crea) y el paso "Postgres
    # descartable" levanta el mismo contenedor a mano en el mismo puerto.
    services:
      postgres:
        image: ${{ vars.CI_RUNNER != 'self-hosted' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: vektor
          POSTGRES_PASSWORD: vektor
          POSTGRES_DB: vektor
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Python 3.12 ───────────────────────────────────────────────────────
      # En el runner propio NO: el Python que baja setup-python para macOS
      # trae fija la ruta /Users/runner/hostedtoolcache (sólo existe en las
      # máquinas de GitHub) y falla con "mkdir: /Users/runner: Permission
      # denied". Ahí se usa el python3.12 de la máquina (paso siguiente).
      - name: Set up Python 3.12
        if: runner.environment != 'self-hosted'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # venv por job: en el runner propio el intérprete de setup-python es
      # persistente y compartido con ci-mcp.yml; sin esto las dependencias de
      # un workflow quedarían instaladas para el otro. RUNNER_TEMP se borra
      # al terminar cada job. En el runner de GitHub es inocuo (~2 s).
      - name: Aislar entorno Python
        run: |
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            PY="$(command -v python3.12 || echo "$HOME/.local/bin/python3.12")"
          else
            PY=python
          fi
          "$PY" -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      # Sólo runner propio: reemplaza al service `postgres` (ver arriba).
      # El `rm -f` limpia el de un run cancelado a mitad. `-h 127.0.0.1`: durante
      # el init, la imagen levanta un servidor temporal sólo por socket; por TCP
      # recién responde el definitivo.
      - name: Postgres descartable (runner propio)
        if: runner.environment == 'self-hosted'
        run: |
          docker rm -f vektor-ci-pg >/dev/null 2>&1 || true
          docker run -d --name vektor-ci-pg \
            -e POSTGRES_USER=vektor -e POSTGRES_PASSWORD=vektor -e POSTGRES_DB=vektor \
            -p 55432:5432 postgres:16
          for _ in $(seq 1 30); do
            docker exec vektor-ci-pg pg_isready -h 127.0.0.1 -U vektor && exit 0
            sleep 2
          done
          echo "Postgres no respondió en 60 s" >&2
          exit 1

      # ── 3. Install dependencies (cached) ─────────────────────────────────────
      # Sólo en GitHub: en el runner propio pip ya conserva su caché local, y
      # subirla a GitHub desde la conexión del dev cuesta más de lo que ahorra.
      - name: Cache pip
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # ── 4. Ruff (linting) ────────────────────────────────────────────────────
      - name: Ruff — lint
        run: ruff check .

      # ── 5. mypy (type checking) ───────────────────────────────────────────────
      - name: mypy — type check
        run: mypy app

      # ── 6. pytest (coverage ≥ 60%) ────────────────────────────────────────────
      - name: pytest — unit + integration
        env:
          # SQLite in-memory — no external services required
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          # Puerto cerrado A PROPÓSITO, también las URLs de Celery (sus defaults
          # apuntan al 6379): la suite corre sin Redis y hay tests del camino
          # "Celery no encola → fallback sincrónico". En el runner propio el
          # 6379 es el Redis del compose del dev; con él vivo, Celery encola y
          # test_el_fallback_sincronico_deja_el_archivo_rechazado_no_fallado
          # falla (queda PENDING). En GitHub da lo mismo que antes: nada escucha.
          REDIS_URL: "redis://localhost:1/0"
          CELERY_BROKER_URL: "redis://localhost:1/1"
          CELERY_RESULT_BACKEND: "redis://localhost:1/2"
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          ENVIRONMENT: "test"
          ALLOWED_ORIGINS: "http://localhost:3000"
          S3_ENDPOINT_URL: ""
          S3_ACCESS_KEY_ID: ""
          S3_SECRET_ACCESS_KEY: ""
          S3_BUCKET_NAME: "vektor-test"
          SMTP_HOST: "localhost"
          SMTP_PORT: "1025"
          SMTP_USER: ""
          SMTP_PASSWORD: ""
          SMTP_FROM_EMAIL: "test@vektor.app"
          # En test no hay servicio de email: el validator de Settings exige
          # RESEND_API_KEY/SMTP_PASSWORD si la verificación está activa. Desactivarla
          # acá evita que el conftest falle al instanciar Settings (sin esto el CI
          # rompe al cargar conftest, no por los tests).
          ENABLE_EMAIL_VERIFICATION: "false"
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            -v

      # ── 6b. Alembic — validar la MIGRACIÓN sobre Postgres real ────────────────
      # `create_all` prueba el modelo ORM, NO la migración. Correr `upgrade head`
      # contra el Postgres del service valida toda la cadena Alembic desde cero
      # (falla el CI si una migración no aplica en Postgres, que SQLite no detecta).
      - name: Alembic — upgrade head (Postgres)
        env:
          # DATABASE_URL (postgresql://) → env.py lo convierte a psycopg2 (sync).
          # El resto es por si algún módulo importado carga Settings (CI sin .env).
          DATABASE_URL: "postgresql://vektor:vektor@localhost:55432/vektor"
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          ENVIRONMENT: "test"
          ALLOWED_ORIGINS: "http://localhost:3000"
          S3_ENDPOINT_URL: ""
          S3_ACCESS_KEY_ID: ""
          S3_SECRET_ACCESS_KEY: ""
          S3_BUCKET_NAME: "vektor-test"
          SMTP_HOST: "localhost"
          SMTP_PORT: "1025"
          SMTP_USER: ""
          SMTP_PASSWORD: ""
          SMTP_FROM_EMAIL: "test@vektor.app"
          ENABLE_EMAIL_VERIFICATION: "false"
        run: alembic upgrade head

      # ── 6c. pytest — tests de concurrencia contra Postgres real ───────────────
      # Corre SOLO los tests marcados `postgres` (advisory locks F3 + lease F4 +
      # contención de savepoints F5-A + índices únicos y migración F5-B) con
      # TEST_PG_DSN apuntando al service, sobre el schema recién migrado.
      # El paso 6b de arriba ya ejerció el preflight y el CREATE CONCURRENTLY de
      # F5-B al aplicar la cadena: si la migración no aplica, el CI corta ahí.
      # Sin cobertura (subconjunto acotado; la cobertura la mide el paso 6).
      - name: pytest — integración Postgres (concurrencia)
        env:
          # TEST_PG_DSN activa los tests marcados `postgres` (apunta al service).
          # El resto del env es el MISMO que el paso SQLite: el app (conftest →
          # Settings) sigue usando SQLite; los tests PG abren su propio engine.
          TEST_PG_DSN: "postgresql+asyncpg://vektor:vektor@localhost:55432/vektor"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          # Puerto cerrado A PROPÓSITO, también las URLs de Celery (sus defaults
          # apuntan al 6379): la suite corre sin Redis y hay tests del camino
          # "Celery no encola → fallback sincrónico". En el runner propio el
          # 6379 es el Redis del compose del dev; con él vivo, Celery encola y
          # test_el_fallback_sincronico_deja_el_archivo_rechazado_no_fallado
          # falla (queda PENDING). En GitHub da lo mismo que antes: nada escucha.
          REDIS_URL: "redis://localhost:1/0"
          CELERY_BROKER_URL: "redis://localhost:1/1"
          CELERY_RESULT_BACKEND: "redis://localhost:1/2"
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          ENVIRONMENT: "test"
          ALLOWED_ORIGINS: "http://localhost:3000"
          S3_ENDPOINT_URL: ""
          S3_ACCESS_KEY_ID: ""
          S3_SECRET_ACCESS_KEY: ""
          S3_BUCKET_NAME: "vektor-test"
          SMTP_HOST: "localhost"
          SMTP_PORT: "1025"
          SMTP_USER: ""
          SMTP_PASSWORD: ""
          SMTP_FROM_EMAIL: "test@vektor.app"
          ENABLE_EMAIL_VERIFICATION: "false"
        # Acotado a app/tests/integration: los 10 archivos con el mark viven todos
        # ahí; sin el path, pytest colectaba la suite entera (~3900 tests) para
        # correr ~120.
        #
        # -n 0 (secuencial, override del "-n auto" de pyproject.toml): a
        # diferencia de la suite SQLite, acá TODOS los workers de xdist
        # comparten el MISMO Postgres — no hay aislamiento por worker. Uno de
        # estos tests (test_reread_review_states_migration_pg.py) corre un
        # downgrade/upgrade de migración REAL sobre ese Postgres compartido
        # (dropea y re-agrega data_repair_runs.updated_at); en paralelo, otro
        # worker puede consultar esa columna justo en la ventana en la que no
        # existe → UndefinedColumnError espurio, reproducido y confirmado
        # localmente (hallazgo real, no de este cambio — la corrida secuencial
        # es 100% estable, la paralela falla de forma no determinística).
        run: pytest app/tests/integration -m postgres --no-cov -v -n 0

      # ── 7. Docker build (verify only, no push) ───────────────────────────────
      - name: Docker — verify build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: vektor-backend:ci

      # Sólo runner propio: el contenedor no lo borra nadie más.
      - name: Borrar Postgres descartable (runner propio)
        if: always() && runner.environment == 'self-hosted'
        run: docker rm -f vektor-ci-pg >/dev/null 2>&1 || true
