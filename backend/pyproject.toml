[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", ".venv312", ".python312", "htmlcov"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ANN"]
ignore = [
    "ANN401",  # Dynamically typed expressions (typing.Any) — accepted in places
    "B008",    # Do not perform function call in argument defaults — FastAPI Depends() pattern
]

[tool.ruff.lint.per-file-ignores]
"app/tests/**" = ["ANN", "S101", "N806"]
"app/persistence/migrations/**" = ["ANN", "N999"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "jose.*", "passlib.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.tests.*"]
# Tests exentos de tipado estricto: las firmas usan fixtures sin tipar y los
# cuerpos usan MagicMock/AsyncMock (tipo Any) extensamente. Relajar estas flags
# de strict mantiene los tests verdes sin ruido de type:ignore en cada mock.
# (union-attr/arg-type/operator NO se relajan: siguen cazando bugs reales.)
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_any_generics = false
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
# Migraciones Alembic: archivos autogenerados, no se tipan.
module = ["app.persistence.migrations.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    # Sin coverage por defecto: el gate de cobertura vive en el CI (paso pytest
    # con --cov-fail-under=60 explícito) y en `make test-cov`. Correr cov+html
    # en cada run local costaba ~1 min y 600 archivos de htmlcov que nadie lee.
    # Paralelizar por defecto (pytest-xdist): cada worker tiene su propia DB
    # in-memory. Para debuggear secuencial: pytest -n 0 (-p no:xdist NO
    # funciona: deja el "-n auto" de addopts huérfano y pytest corta).
    "-n", "auto",
]
asyncio_default_fixture_loop_scope = "session"
# Solo markers que se USAN. `unit`/`integration`/`redis`/`celery` estuvieron
# declarados sin un solo uso en 266 archivos — un marker muerto invita a creer
# que filtra algo.
markers = [
    "postgres: requiere PostgreSQL real (docker)",
    "slow: e2e pesados (>15s); excluibles en local con -m 'not slow'",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/tests/*",
    "app/persistence/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
]
